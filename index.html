<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOAH — InnovaClark</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #05070d;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 900px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
        }

        .header h1 {
            font-size: 42px;
            letter-spacing: 12px;
            font-weight: 300;
        }

        .header p {
            margin-top: 8px;
            color: #7f8799;
            letter-spacing: 4px;
            font-size: 11px;
        }

        .core {
            width: 210px;
            height: 210px;
            border-radius: 50%;
            border: 1px solid rgba(120, 180, 255, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow:
                0 0 25px rgba(80, 150, 255, 0.25),
                0 0 80px rgba(80, 150, 255, 0.12);
        }

        .core::before {
            content: "";
            width: 125px;
            height: 125px;
            border-radius: 50%;
            border: 2px solid rgba(130, 190, 255, 0.7);
            box-shadow:
                0 0 20px rgba(100, 180, 255, 0.6),
                inset 0 0 25px rgba(100, 180, 255, 0.2);
            animation: pulse 3s infinite ease-in-out;
        }

        .core::after {
            content: "";
            position: absolute;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #b9ddff;
            box-shadow:
                0 0 15px #8ac5ff,
                0 0 35px #4e9cff;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(0.95);
                opacity: 0.65;
            }

            50% {
                transform: scale(1.08);
                opacity: 1;
            }
        }

        .status {
            color: #8aa0bd;
            font-size: 12px;
            letter-spacing: 3px;
            margin-top: 30px;
        }

        .input-area {
            width: 100%;
            max-width: 650px;
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(150,180,220,0.25);
            border-radius: 30px;
            padding: 16px 20px;
            color: white;
            outline: none;
            font-size: 15px;
        }

        .input-area input::placeholder {
            color: #697386;
        }

        .input-area button {
            width: 55px;
            border: none;
            border-radius: 50%;
            background: #101a2b;
            color: white;
            font-size: 20px;
            cursor: pointer;
            border: 1px solid rgba(130,180,255,0.3);
        }

        .input-area button:active {
            transform: scale(0.95);
        }

        .response {
            min-height: 25px;
            color: #aeb9ca;
            text-align: center;
            font-size: 14px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>NOAH</h1>
            <p>INNOVACLARK AI</p>
        </div>

        <div>
            <div class="core"></div>

            <div class="status">
                SYSTEM ONLINE
            </div>
        </div>

        <div class="response" id="response">
            Esperando a Clark...
        </div>

        <div class="input-area">
            <input
                type="text"
                id="message"
                placeholder="Habla con Noah..."
            >

            <button onclick="talkToNoah()">➤</button>
        </div>

    </div>

<script src="noah-core.js"></script>

<script>
    // Inicializar Noah
    const noah = getNoahIdentity();

    // Personalizar la interfaz
    document.getElementById("response").textContent =
        `Esperando a ${noah.user.preferred_name}...`;

    function talkToNoah() {

        const input = document.getElementById("message");
        const response = document.getElementById("response");

        const message = input.value.trim();

        if (message === "") {
            response.textContent =
                `Estoy escuchando, ${noah.user.preferred_name}.`;
            return;
        }

        const lowerMessage = message.toLowerCase();

        if (
            lowerMessage.includes("quién eres") ||
            lowerMessage.includes("quien eres")
        ) {
            response.textContent =
                `Soy ${noah.identity.name}, tu asistente personal. Estoy aquí para ayudarte, ${noah.user.preferred_name}.`;
        } else {
            response.textContent =
                `Recibido, ${noah.user.preferred_name}. Noah Core está funcionando.`;
        }

        input.value = "";
    }
</script>

</body>
</html>
